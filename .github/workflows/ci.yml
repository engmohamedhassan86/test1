name: CI

on:
  # Every branch, so a feature branch is proven green before a PR exists.
  push:
  pull_request:
    branches: [main]
  # A secret is only read when a run starts, so changing one does not re-test
  # anything by itself. This makes "run the gates again on the same commit" a
  # button in the Actions tab, instead of an empty commit.
  workflow_dispatch:

# A PR branch also gets a push event. Group both under the same key so the
# duplicate run is cancelled instead of burning a second set of minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    # PrimeNG 22 needs a PrimeUI licence key or it paints an "Invalid PrimeUI
    # License" banner over the app. The key is the repository secret of the same
    # name, and the two "licence key" steps below fail the job if it is missing,
    # inactive, or absent from the built bundle.
    env:
      PRIMEUI_LICENSE_KEY: ${{ secrets.PRIMEUI_LICENSE_KEY }}
    steps:
      - uses: actions/checkout@v4

      # Version comes from the "packageManager" field in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Before the slow gates, so a missing secret is reported in seconds. Prints
      # the key's id, tier and expiry, never the key.
      - name: PrimeUI licence key is present and active
        run: pnpm run check:license

      - name: Format check
        run: pnpm run format:check

      - name: Type check
        run: pnpm run typecheck

      - name: Unit tests with coverage
        run: pnpm run test:coverage

      - name: Build
        run: pnpm run build

      # The build tolerates a missing key, so prove the key actually landed in the
      # artefact rather than trusting that the environment variable was set.
      # Called directly rather than through pnpm, so there is no question about
      # how the extra argument is forwarded.
      - name: PrimeUI licence key reached the bundle
        run: node scripts/check-primeui-license.mjs --bundle dist/survey-viewer/browser
